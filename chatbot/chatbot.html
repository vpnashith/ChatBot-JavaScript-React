<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">

      //this is a React component, it is a function that returns JSX (a syntax extension for JavaScript that looks similar to HTML)
      function ChatInput(){
        return (
          //this is a React Fragment, it allows us to return multiple elements without adding an extra node to the DOM
          <>
            <input 
              placeholder= "Send a message to chatbot" 
              size="30" 
            />
            <button>Send</button>
          </>
        )
      };

    // Component for chat message
    function ChatMessage({message, sender}){
      /* const message = props.message;
         const sender = props.sender; */
      // OR
      // const {message, sender} = props;

      /*if (sender === "robot"){
        return (
      <div>
        <img src="robot.png" width="50" />
        {message}
      </div>
        );
      }*/

      return (
      <div>
        {sender === "robot" && <img src="robot.png" width="50" />}
        {message}
        {sender === "user" && <img src="user.png" width="50" />}
      </div>
      )
    };

    function ChatMessages(){
      // We have to make the chat messages to states for when an update is hapening , it shoud update the HTML also, otherwise it only 
      // update the list, it wont reflect the HTML 
      // To make it as a state, we can use "React.useState()"

      const array = React.useState(  //This will return two variable: 1. the current data 2. a function that used to update the data
        [
          {
            message: "Hello chatbot",
            sender: "user"
          },
          {
            message: "Hi how can I help",
            sender: "robot"
          },
          {
            message: "what is react?",
            sender: "user"
          },
          {
            message: "react is JS library for building UI",
            sender: "robot"
          }
        ]
      );
      const chatMessages = array[0];
      const setChatMessages = array[1]; // In react we do not update the data directly, we have to use this function, otherwise the HTML won't get updated
            
      function sendMessage(){
        // setChatMessages works s.t it will update the current value with whatever we are given.
        // Since we are using this function to update the array, react will rerun the code internally and HTML will updated
        setChatMessages([
          ...chatMessages, // copy the chatMessages array . <spread operator>
          {
            message: "what is 1+1",
            sender: "user"
          }
        ]
        );
        
    }

     return (
      <>

        <button onClick={sendMessage}>Send message</button>

        {chatMessages.map((chatMessage, index) => {
          return (
            <ChatMessage 
              key={index} 
              message={chatMessage.message} 
              sender={chatMessage.sender} 
            />
          );
        })}
      </>
    );
    }

  
    // Best practice is to create a component for the app and render it to the DOM, 
    // Which represent the whole application and it can contain other components inside it.
    function App(){
        return (
          <div>
            <ChatInput />
            <ChatMessages />
          </div>
      );
    }

    const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
